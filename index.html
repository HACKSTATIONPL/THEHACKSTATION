<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Research Lab v2.0</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; margin: 0; overflow: hidden; }
        #terminal { background: #000; border: 1px solid #00ff00; height: calc(100vh - 160px); overflow-y: auto; padding: 10px; margin-bottom: 15px; box-shadow: inset 0 0 10px #00ff00; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: #002200; color: #00ff00; border: 1px solid #00ff00; padding: 15px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #00ff00; color: #000; }
        .crit { color: #ff0000; font-weight: bold; }
        .warn { color: #ffff00; }
        .ok { color: #00ccff; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">PS4 WEBKIT FUZZER [13.50]</h2>
    <div id="terminal">
        <div>[SYSTEM] Gotowy do inicjacji...</div>
        <div>[INFO] Wybierz silnik ataku poniżej.</div>
    </div>

    <div class="controls">
        <button onclick="testJIT()">Silnik 1: JIT 2.0</button>
        <button onclick="testUAF()">Silnik 2: UAF Spray</button>
    </div>

    <script>
        const term = document.getElementById('terminal');
        var storage = [];

        function print(msg, type = '') {
            const line = document.createElement('div');
            if (type) line.className = type;
            line.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight;
        }

        // --- Ulepszony Silnik 1: JIT Type Confusion ---
        function testJIT() {
            print("Inicjacja JIT Type Confusion...", "warn");
            
            function get_val(arr, idx) {
                return arr[idx];
            }

            let normal_arr = [1.1, 2.2, 3.3];
            let mixed_arr = [{}]; // Tablica z obiektem

            print("Faza 1: Rozgrzewanie optymalizatora (100k iteracji)...");
            
            // Zmuszamy JIT do uznania, że ta funkcja zawsze zwraca liczby
            for(let i = 0; i < 100000; i++) {
                get_val(normal_arr, 0);
            }

            print("Faza 2: Próba wywołania błędu logicznego!", "crit");
            
            // Nagłe wysłanie obiektu - JIT spróbuje go przeczytać jak liczbę Double
            setTimeout(() => {
                for(let i = 0; i < 100; i++) {
                    get_val(mixed_arr, 0);
                }
                print("Atak zakończony. Sprawdź stabilność systemu.", "ok");
            }, 500);
        }

        // --- Ulepszony Silnik 2: Cichy Heap Spray (UAF) ---
        function testUAF() {
            print("Inicjacja Cichego Heap Spray...", "warn");
            storage = []; // Czyścimy poprzednie próby

            try {
                // Rozmiar 0x100 (256 bajtów) jest idealny dla PS4 - omija alerty pamięci masowej
                for(let i = 0; i < 20000; i++) {
                    let b = new ArrayBuffer(0x100);
                    let v = new Float64Array(b);
                    
                    // Wypełniamy wartościami udającymi adresy w pamięci
                    v.fill(5.4476037220116e-270); 
                    
                    storage.push(v); // Blokujemy czyszczenie pamięci (GC)

                    if(i % 5000 === 0 && i > 0) {
                        print(`Zalokowano ${i} obiektów...`);
                    }
                }
                
                print("Pamięć nasycona. Wyzwalanie Corruption...", "crit");
                
                // Próba przepełnienia struktury tablicy
                let trigger = new Array(0x1000);
                trigger.fill(0.1);
                trigger.length = 0xFFFFFFFF; 
                
            } catch(e) {
                print("Błąd: " + e.message, "crit");
            }
        }
    </script>
</body>
</html>
